name: FacebookApp
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: 17.0
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.example.facebookapp
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
packages: {}
targets:
  FacebookApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      - path: Resources
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_NAME: FacebookApp
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
